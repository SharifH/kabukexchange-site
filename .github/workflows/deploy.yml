name: Deploy GitHub Pages with Staging Gate

on:
  push:
    branches:
      - main # Triggers when code hits your default branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. STAGING JOB: Build your site and upload the artifact for verification
  build-and-stage:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # (Optional) If you have a build step like npm run build, insert it here:
      # - name: Build Site
      #   run: npm run build

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Point to your static folder (e.g., './dist' if using a builder)

  # 2. PRODUCTION JOB: Pauses for manual approval before making it live
  deploy-to-production:
    needs: build-and-stage
    environment:
      name: production # This triggers the "Required Reviewers" rule you set up
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
